[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 checksums for bundled native DLLs"
regexTarget = "match"
regexes = [
  '''sherpa-onnx-c(?:xx)?-api\.dll"\s*:\s*"[a-f0-9]{64}"''',
]

[[allowlists]]
description = "Generated and dependency directories are not repository content"
paths = [
  '''(^|/)\.build/''',
  '''(^|/)\.webpack/''',
  '''(^|/)node_modules/''',
  '''(^|/)out/''',
]
